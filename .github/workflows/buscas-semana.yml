name: Buscas da semana

# Toda segunda: baixa do GoatCounter o que as pessoas buscaram (achando ou não) e as páginas de
# resíduo visitadas, por cidade, e atualiza metricas/resumo-por-cidade.md (últimas 4 semanas).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # segunda, 6h17 em Brasília

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: |
          set -o pipefail
          python3 metricas/buscas_semana.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 metricas/resumo_cidades.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet || git commit -m "Buscas da semana"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
