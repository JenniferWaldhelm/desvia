name: Achar coordenadas dos endereços

# Lê coleta/geocodificar.csv e grava coleta/geocodificado.csv. Não altera o site.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocodificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 coleta/geocodificar.py
      - run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add coleta/geocodificado.csv
          git diff --cached --quiet || git commit -m "Coordenadas dos endereços"
          git pull --rebase -q && git push
