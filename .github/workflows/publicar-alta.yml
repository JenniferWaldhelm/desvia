name: Preparar empresas Alta da Revisão
on: workflow_dispatch
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar aba Revisão e selecionar
        run: |
          curl -fsSL "https://docs.google.com/spreadsheets/d/e/2PACX-1vRYt3WY6jEpAs9iS9Icz4jTQl_O_JA7pFLJ8Gd0-vKCC5Xsbs1j2VkJR1F9YolAvLoYp6t25704z2yV/pub?gid=97&single=true&output=csv" -o revisao.csv
          head -1 revisao.csv
          python3 coleta/publicar_alta.py revisao.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Gravar
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coleta/alta-publicar.csv coleta/alta-fora.csv
          git commit -m "Empresas Alta da Revisão preparadas para a aba Pontos" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
