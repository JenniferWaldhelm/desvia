name: Diagnóstico dos localizadores
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 coleta/diag_localizadores.py | tee -a "$GITHUB_STEP_SUMMARY"
      - run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add coleta/diag
          git diff --cached --quiet || git commit -m "Diagnóstico dos localizadores"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
