name: Conferir licenças das empresas da Receita

# Cruza coleta/<cidade>-receita.csv com o IAT (por CNPJ) e o CTF/IBAMA.
on:
  workflow_dispatch:
    inputs:
      municipio:
        description: "Município do Paraná (ex.: Sarandi)"
        required: true

permissions:
  contents: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Conferir
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: |
          set -o pipefail
          python3 coleta/conferir_licencas.py "$MUNICIPIO" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar resultado
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add coleta/*-receita.csv coleta/*-receita-resumo.md
          git diff --cached --quiet || git commit -m "Receita: licenças conferidas em $MUNICIPIO"
          git pull --rebase -q && git push
