name: Exportar métricas do mês

# Dia 2 de cada mês: baixa do GoatCounter as visitas e buscas do mês anterior
# e grava em metricas/AAAA-MM/. A análise mensal (dia 3) lê daqui.
on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês no formato AAAA-MM (vazio = mês anterior)"
        required: false
  schedule:
    - cron: "41 10 2 * *"   # dia 2, 7h41 em Brasília

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GoatCounter
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 metricas/exportar.py ${{ inputs.mes }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet || git commit -m "Métricas do mês"
          git pull --rebase -q && git push
