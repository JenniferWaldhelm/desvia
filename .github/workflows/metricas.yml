name: Exportar métricas do mês

# Dia 2 de cada mês: baixa Bing Webmaster e GoatCounter do mês anterior para metricas/AAAA-MM/.
# Precisa dos segredos BING_API_KEY e GOATCOUNTER_TOKEN (Settings › Secrets and variables › Actions).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 11 2 * *"   # dia 2, 8h41 em Brasília

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 coleta/metricas.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add metricas
          git diff --cached --quiet || git commit -m "Métricas do mês"
          git pull --rebase -q && git push
