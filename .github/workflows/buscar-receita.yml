name: Buscar empresas na Receita

# Procura na base aberta de CNPJs da Receita as empresas de um município com
# atividade de resíduo (inclusive sem licença). Grava coleta/<cidade>-receita.csv
# e coleta/<cidade>-receita-resumo.md. Não altera o site.
on:
  workflow_dispatch:
    inputs:
      municipio:
        description: "Município do Paraná (ex.: Sarandi)"
        required: true

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Arquivo mensal do Paraná (se existir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download receita-pr -D /tmp/receita-pr && cat /tmp/receita-pr/mes.txt || echo "Sem arquivo mensal; baixando direto da Receita (lento)"

      - name: Buscar
        env:
          MUNICIPIO: ${{ inputs.municipio }}
          RECEITA_PR: /tmp/receita-pr
        run: |
          set -o pipefail
          python3 coleta/buscar_receita.py "$MUNICIPIO" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Conferir licenças (IAT e CTF/IBAMA)
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: python3 coleta/conferir_licencas.py "$MUNICIPIO" | tee -a "$GITHUB_STEP_SUMMARY" || echo "Conferência falhou; rodar a ação Conferir licenças"

      - name: Preparar revisão (checagens e nota de confiança)
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: |
          pip install -q shapely
          python3 coleta/preparar.py "$MUNICIPIO" | tee -a "$GITHUB_STEP_SUMMARY" || echo "Preparação falhou"

      - name: Salvar resultado
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add coleta/*-receita.csv coleta/*-receita-resumo.md coleta/*-revisao.csv coleta/*-revisao-resumo.md
          git diff --cached --quiet || git commit -m "Receita: empresas de resíduo em $MUNICIPIO"
          git pull --rebase -q && git push
