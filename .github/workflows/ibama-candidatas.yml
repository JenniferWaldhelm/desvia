name: Conferir candidatas do IBAMA (RAPP)

# Confere no IAT e na Receita as empresas que declaram ao IBAMA receber resíduo
# nos municípios do Desvia e ainda não estão na base. Grava coleta/ibama-candidatas.csv.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - coleta/conferir_ibama.py
      - .github/workflows/ibama-candidatas.yml

permissions:
  contents: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Conferir
        run: |
          set -o pipefail
          python3 coleta/conferir_ibama.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar resultado
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add coleta/ibama-candidatas.csv coleta/ibama-candidatas-resumo.md
          git diff --cached --quiet || git commit -m "IBAMA: candidatas conferidas no IAT e na Receita"
          git pull --rebase -q && git push
