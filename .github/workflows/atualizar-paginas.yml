name: Atualizar páginas de resíduos

# Baixa a aba Pontos da planilha "Desvia - Base Mestra" (se publicada como CSV),
# regenera as páginas em residuos/ e o sitemap, publica se algo mudou
# e avisa o Bing (IndexNow) sobre as páginas.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dados/**", "gerador/**"]
  schedule:
    - cron: "17 9 * * 1"   # toda segunda, 6h17 em Brasília

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar a planilha publicada
        if: ${{ vars.PLANILHA_CSV_URL != '' }}
        env:
          URL: ${{ vars.PLANILHA_CSV_URL }}
        run: |
          curl -fsSL "$URL" -o dados/pontos.novo.csv
          head -1 dados/pontos.novo.csv | grep -q "^ID," || { echo "CSV inesperado"; exit 1; }
          mv dados/pontos.novo.csv dados/pontos.csv

      - name: Gerar páginas
        run: python3 gerador/gerar.py

      - name: Publicar alterações
        id: publicar
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add dados/pontos.csv residuos guias index.html sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Nada mudou."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza páginas de resíduos a partir da planilha"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar o Bing (IndexNow)
        if: ${{ steps.publicar.outputs.mudou == 'sim' || github.event_name != 'schedule' }}
        run: |
          sleep 120   # espera o GitHub Pages publicar
          python3 gerador/indexnow.py
