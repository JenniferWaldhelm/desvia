name: Atualizar páginas de resíduos

# Baixa a aba Pontos da planilha "Desvia - Base Mestra" (se publicada como CSV),
# regenera as páginas em residuos/ e o sitemap, publica se algo mudou
# e avisa o Bing (IndexNow) sobre as páginas.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dados/**", "gerador/**"]
  schedule:
    - cron: "17 9 * * 1"   # toda segunda, 6h17 em Brasília

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar a planilha publicada
        env:
          # aba Pontos publicada como CSV (Arquivo › Compartilhar › Publicar na Web); a variável PLANILHA_CSV_URL, se existir, tem prioridade
          URL: ${{ vars.PLANILHA_CSV_URL || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYt3WY6jEpAs9iS9Icz4jTQl_O_JA7pFLJ8Gd0-vKCC5Xsbs1j2VkJR1F9YolAvLoYp6t25704z2yV/pub?gid=0&single=true&output=csv' }}
        run: |
          curl -fsSL "$URL" -o dados/pontos.novo.csv
          head -1 dados/pontos.novo.csv | grep -q "^ID," || { echo "CSV inesperado"; exit 1; }
          python3 - <<'PY'
          import csv, sys
          novo = [r for r in csv.DictReader(open("dados/pontos.novo.csv", encoding="utf-8")) if r.get("ID")]
          atual = list(csv.DictReader(open("dados/pontos.csv", encoding="utf-8")))
          if len(novo) < 0.9 * len(atual):
              sys.exit(f"Planilha com {len(novo)} pontos, menos de 90% dos {len(atual)} atuais: não publico (possível erro).")
          ruins = []
          for r in novo:
              for c in ("Lat", "Lng"):
                  v = (r.get(c) or "").strip().replace(",", ".")
                  if v:
                      try:
                          float(v)
                      except ValueError:
                          ruins.append(f"{r['ID']} {c}={r[c]}")
          if ruins:
              print("Coordenadas inválidas (ignoradas no mapa):", "; ".join(ruins[:20]))
          print(f"Planilha OK: {len(novo)} pontos (antes {len(atual)}).")
          PY
          mv dados/pontos.novo.csv dados/pontos.csv

      - name: Gerar páginas
        run: python3 gerador/gerar.py

      - name: Publicar alterações
        id: publicar
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add dados/pontos.csv residuos guias empresas index.html sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Nada mudou."
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza páginas de resíduos a partir da planilha"
            git push
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Avisar o Bing (IndexNow)
        if: ${{ steps.publicar.outputs.mudou == 'sim' || github.event_name != 'schedule' }}
        run: |
          sleep 120   # espera o GitHub Pages publicar
          python3 gerador/indexnow.py
