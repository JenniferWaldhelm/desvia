name: Buscar empresas de uma cidade

# Levanta empresas de resíduos de um município (IAT + CTF/IBAMA + Receita)
# e grava coleta/<cidade>.csv e coleta/<cidade>-resumo.md. Não altera o site.
on:
  workflow_dispatch:
    inputs:
      municipio:
        description: "Município do Paraná, com acento (ex.: Ibiporã)"
        required: true

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: python3 coleta/buscar_cidade.py "$MUNICIPIO" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Salvar resultado
        env:
          MUNICIPIO: ${{ inputs.municipio }}
        run: |
          git config user.name "Desvia (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add coleta/*.csv coleta/*.md
          git diff --cached --quiet || git commit -m "Coleta automática: $MUNICIPIO"
          git pull --rebase -q && git push
